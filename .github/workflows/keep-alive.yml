name: Backend Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep Render Backend Warm
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://nodexa-api.onrender.com/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Service responded with HTTP $STATUS"
          fi
